<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PLY Compare Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #fff; font-family: sans-serif; }
  #info { position: fixed; top: 10px; left: 10px; z-index: 10; font-size: 14px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 6px; max-width: 400px; }
  #toggle { position: fixed; top: 10px; right: 10px; z-index: 10; display: flex; flex-direction: column; gap: 6px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 6px; font-size: 13px; }
  #toggle label { cursor: pointer; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">Loading mesh_layer2.ply...</div>
<div id="toggle">
  <label><input type="radio" name="mode" value="orchestra" checked> MIDIOrchestra方式<br><small>MeshBasicMaterial, depthTest:off</small></label>
  <label><input type="radio" name="mode" value="standard"> 標準方式<br><small>MeshStandardMaterial, depthTest:on</small></label>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

// ライティング（標準方式用）
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

const info = document.getElementById('info');
const loader = new PLYLoader();

// マテリアル2種
const matOrchestra = new THREE.MeshBasicMaterial({
  vertexColors: true,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 1,
  depthWrite: false,
  depthTest: false,
});
const matStandard = new THREE.MeshStandardMaterial({
  vertexColors: true,
  side: THREE.DoubleSide,
  roughness: 0.8,
  metalness: 0.0,
});

let currentMesh = null;

const url = 'data/media/The_Color_of_the_Summer_Sky_plyBg2.ply?_cb=' + Date.now();
info.textContent = 'Fetching mesh_layer2.ply (384MB)...';

loader.load(url, (geometry) => {
  const hasColor = !!geometry.attributes.color;
  const vCount = geometry.attributes.position.count;
  const fCount = geometry.index ? geometry.index.count / 3 : 0;
  info.textContent = `${vCount.toLocaleString()} vertices, ${fCount.toLocaleString()} faces\nMode: MIDIOrchestra方式`;

  currentMesh = new THREE.Mesh(geometry, matOrchestra);
  currentMesh.rotateX(-Math.PI / 2);
  currentMesh.frustumCulled = false;
  scene.add(currentMesh);

  // カメラフィット
  geometry.computeBoundingBox();
  const center = new THREE.Vector3();
  geometry.boundingBox.getCenter(center);
  const size = new THREE.Vector3();
  geometry.boundingBox.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z);

  controls.target.copy(center.clone().applyAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2));
  camera.position.copy(controls.target).add(new THREE.Vector3(0, maxDim * 0.3, maxDim * 0.8));
  controls.update();

}, (xhr) => {
  if (xhr.total) {
    const pct = Math.round(xhr.loaded / xhr.total * 100);
    info.textContent = `Loading... ${pct}% (${(xhr.loaded/1024/1024).toFixed(0)}MB / ${(xhr.total/1024/1024).toFixed(0)}MB)`;
  }
}, (err) => {
  info.textContent = 'Error: ' + err.message;
});

// モード切替
document.querySelectorAll('input[name="mode"]').forEach(r => {
  r.addEventListener('change', () => {
    if (!currentMesh) return;
    const mode = r.value;
    if (mode === 'orchestra') {
      currentMesh.material = matOrchestra;
      info.textContent = info.textContent.replace(/Mode:.*/, 'Mode: MIDIOrchestra方式');
    } else {
      currentMesh.material = matStandard;
      info.textContent = info.textContent.replace(/Mode:.*/, 'Mode: 標準方式');
    }
  });
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
